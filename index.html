</style></head><body><header><strong>GRANADO / Inventário</strong></header><main><section><h1>Ler fleje</h1><p>Aponte para o código de barras da etiqueta e mantenha o celular parado.</p><video id="video" playsinline muted hidden></video><p id="msg" role="status">Toque em “Iniciar leitura” e permita o uso da câmera.</p><p id="result"></p><button id="start" type="button">Iniciar leitura</button><button id="retry" type="button" hidden>Ler novamente</button><small>O código é enviado ao aplicativo de inventário para consulta. A contagem precisa ser confirmada no aplicativo.</small></section></main>
