<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Leitor de flejes</title><style>
*{box-sizing:border-box}body{margin:0;background:#edf4f6;color:#17334a;font:16px system-ui}header{background:#123651;color:white;padding:16px}main{max-width:600px;margin:auto;padding:14px}section{background:#fff;border:1px solid #dce7eb;border-radius:16px;padding:16px}h1{font-size:22px;margin:0 0 8px}p{line-height:1.4;margin:10px 0}button{border:0;border-radius:10px;background:#086e77;color:white;padding:15px;font:inherit;font-weight:700;width:100%;margin:8px 0}button[hidden],div[hidden]{display:none}.view{position:relative;background:#102932;border-radius:10px;overflow:hidden}.view video{display:block;width:100%;max-height:65vh;object-fit:contain}.guide{pointer-events:none;position:absolute;inset:25% 12%;border:3px solid #5fe6cb;border-radius:12px;box-shadow:0 0 0 999px #0003}#result{overflow-wrap:anywhere;font-weight:700}#msg{color:#345}.error{color:#9a2222!important}
</style></head><body><header><strong>GRANADO / Inventário</strong></header><main><section><h1>Ler fleje</h1><div id="preview" class="view" hidden><video id="video" playsinline autoplay muted></video><div class="guide"></div></div><p id="msg" role="status">Abrindo a câmera...</p><p id="result"></p><button id="start" type="button" hidden>Permitir câmera e tentar novamente</button><button id="back" type="button" hidden>Voltar para a contagem</button></section></main>
